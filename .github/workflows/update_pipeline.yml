name: Automated Data Sync & Model Pipeline

on:
  schedule:
    # Run every Monday at 04:00 UTC (after weekend matchdays)
    - cron: '0 4 * * 1'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  sync_and_build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn xgboost requests

      - name: Sync data and rebuild pipeline
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY || '8820cb0b1e8f410cbe65121c1cd19ebe' }}
        run: |
          python update_data.py --rebuild

      - name: Commit and push updated artifacts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add api/predictions.json api/stats.json api/model.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: automated weekly data and prediction update" && git push)
